<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitbox Lab · Directing Game Mechanics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/deck.css">
<link rel="stylesheet" href="../../../assets/kit.css">
<link rel="stylesheet" href="../../shared/dgms.css">
<style>
  .hb-tips { display: grid; grid-template-columns: 1fr; gap: 5px; margin: 4px 0 10px; }
  .hb-tips .btn { text-align: left; font-size: 14px !important; padding: 5px 10px !important; }
  .hb-legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
  .hb-legend .chip { font-size: 13px; }
  .chip.atk { background: #f9d9d6; border-color: #e5322d; color: #8a1c15; }
  .chip.rec { background: #d6ecf8; border-color: #2ea3dc; color: #0f4f73; }
  .chip.col { background: #d8f0df; border-color: #2fae63; color: #145c33; }
</style>
<script>
  window.DECK = { title: 'Directing Game Mechanics · Module 5 · Hitbox Lab', home: '../../index.html', audio: false, cues: null };
</script>
<script src="notes.js"></script>
</head>
<body>
<div class="viewport"><div class="stage">

<section class="slide" data-title="One swing, many names" data-demo="lab">
  <div class="kicker">3Cs: controller · about slides 396-430</div>
  <h2 class="sm">Hitbox lab: <span class="accent">verb, adjective, noun</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <h4>Genre (relabels every box)</h4>
      <div class="seg hb-genre"><button class="btn" data-g="fps">FPS</button><button class="btn" data-g="fight">Fighting</button><button class="btn" data-g="action">Action</button><button class="btn on" data-g="course">Course</button></div>
      <h4>Attack shape</h4>
      <div class="seg hb-shape"><button class="btn on" data-s="box">Box</button><button class="btn" data-s="sphere">Sphere</button><button class="btn" data-s="capsule">Capsule</button><button class="btn" data-s="cylinder">Cylinder</button><button class="btn" data-s="cone">Cone</button></div>
      <label class="chk"><input type="checkbox" class="hb-bone" checked> Ride the weapon bone</label>
      <div class="row wrap"><button class="btn hb-tour on">▶ Walk-through</button></div>
      <div class="mt-stats hb-stats"></div>
      <p class="mt-out hb-out"></p>
    </div>
  </div>
</section>

<section class="slide" data-title="Seven placement tips" data-demo="tips">
  <div class="kicker">3Cs: controller · about slides 431-441</div>
  <h2 class="sm">Seven tips, <span class="accent">same swing</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <h4>Tip (before and after)</h4>
      <div class="hb-tips">
        <button class="btn on" data-k="0">1. Extend attacks inside the body</button>
        <button class="btn" data-k="1">2. Player-favourable volumes a bit big</button>
        <button class="btn" data-k="2">3. Smaller attackable areas</button>
        <button class="btn" data-k="3">4. Secondary boxes for special cases</button>
        <button class="btn" data-k="4">5. Proportional attacks and receivers</button>
        <button class="btn" data-k="5">6. Keep it simple</button>
        <button class="btn" data-k="6">7. Project 3D boxes to the plane</button>
      </div>
      <div class="row wrap"><button class="btn hb-ttour on">▶ Walk-through</button></div>
      <p class="mt-out hb-tout"></p>
    </div>
  </div>
</section>

</div></div>
<script src="../../../assets/deck.js"></script>
<script src="../../../assets/kit.js"></script>
<script src="../../shared/topdown.js"></script>
<script src="hitbox-lab.js"></script>
</body>
</html>
