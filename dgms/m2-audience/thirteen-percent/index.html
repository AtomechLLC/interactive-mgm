<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 13% Rule · Directing Game Mechanics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/deck.css">
<link rel="stylesheet" href="../../../assets/kit.css">
<link rel="stylesheet" href="../../shared/dgms.css">
<script>
  window.DECK = { title: 'Directing Game Mechanics · Module 2 · The 13% Rule', home: '../index.html', audio: false, cues: null };
</script>
<script src="notes.js"></script>
<style>.mt-stats b { flex: none; }</style>
</head>
<body>
<div class="viewport"><div class="stage">

<!-- 1: slides 226-232 -->
<section class="slide" data-title="The 13% rule" data-demo="ladder">
  <div class="kicker">late-stage retention</div>
  <h2 class="sm">When does an upgrade <span class="accent">feel like one?</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <label class="rng">Gap between raid tiers <b class="ld-gv"></b><input type="range" class="ld-g" min="2" max="25" step="0.5" value="13"></label>
      <label class="rng">Time between upgrades <b class="ld-wv"></b><input type="range" class="ld-w" min="0" max="6" step="0.5" value="4"></label>
      <p class="tip">0 weeks = levelling, with a new item every hour or so.</p>
      <div class="row wrap"><button class="btn ld-tour on">▶ Walk-through</button></div>
      <div class="mt-stats ld-stats"></div>
      <p class="mt-out ld-out"></p>
    </div>
  </div>
</section>

<!-- 2: slide 232 -->
<section class="slide" data-title="Fourteen slots, one percent each" data-demo="doll">
  <div class="kicker">late-stage retention</div>
  <h2 class="sm">Fourteen slots, <span class="accent">about 1% each</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <label class="rng">Gap between raid tiers <b class="dl-gv"></b><input type="range" class="dl-g" min="5" max="25" step="0.5" value="13"></label>
      <h4>Drops per raid week</h4>
      <div class="seg dl-drops"><button class="btn on" data-n="1">1</button><button class="btn" data-n="2">2</button><button class="btn" data-n="3">3</button></div>
      <div class="row wrap"><button class="btn dl-next">Next raid week</button><button class="btn dl-reset">Reset</button><button class="btn dl-tour on">▶ Walk-through</button></div>
      <p class="tip">Click a slot to swap that one item.</p>
      <div class="mt-stats dl-stats"></div>
      <p class="mt-out dl-out"></p>
    </div>
  </div>
</section>

<!-- 3: slides 233-237 -->
<section class="slide" data-title="Thunderfury and transmog" data-demo="mog">
  <div class="kicker">late-stage retention</div>
  <h2 class="sm">Keep the look, <span class="accent">let the stats go</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <label class="rng">Character level (next expansion) <b class="mg-lv"></b><input type="range" class="mg-l" min="60" max="70" step="1" value="60"></label>
      <h4>Wield</h4>
      <div class="seg mg-wield"><button class="btn on" data-w="tf">Thunderfury</button><button class="btn" data-w="new">New quest sword</button></div>
      <label class="chk"><input type="checkbox" class="mg-mog"> Transmogrification</label>
      <div class="row wrap"><button class="btn mg-tour on">▶ Walk-through</button></div>
      <div class="mt-stats mg-stats"></div>
      <p class="mt-out mg-out"></p>
    </div>
  </div>
</section>

</div></div>
<script src="../../../assets/deck.js"></script>
<script src="../../../assets/kit.js"></script>
<script src="../../shared/topdown.js"></script>
<script src="thirteen-percent.js"></script>
</body>
</html>
