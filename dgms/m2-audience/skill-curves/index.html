<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Skill Curves · Directing Game Mechanics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../../assets/kit.css">
<link rel="stylesheet" href="../../shared/dgms.css">

</script>
<script src="notes.js"></script>
</head>
<body>
<div class="viewport"><div class="stage">

<!-- 1: slides 67-89 -->
<section class="slide" data-title="Five skill curves, one chart" data-demo="curves">
  <div class="kicker">5 types of player skill curves · slides 67-89</div>
  <h2 class="sm">Five skill curves, <span class="accent">one chart</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <h4>Highlight a curve</h4>
      <div class="seg sc-game">
        <button class="btn" data-k="flat">Chutes and Ladders</button>
        <button class="btn" data-k="gw">Guess Who?</button>
        <button class="btn" data-k="got">A Game of Thrones</button>
        <button class="btn" data-k="go">Go</button>
        <button class="btn on" data-k="chess">Chess</button>
        <button class="btn" data-k="sf3">Street Fighter III</button>
      </div>
      <label class="chk"><input type="checkbox" class="sc-fc" checked> Floor and ceiling markers</label>
      <label class="chk"><input type="checkbox" class="sc-flow"> Flow channel and challenge line</label>
      <label class="rng">Hours played <b class="sc-hv"></b><input type="range" class="sc-h" min="0" max="400" step="1" value="200"></label>
      <div class="row wrap"><button class="btn sc-tour on">▶ Walk-through</button></div>
      <div class="mt-stats sc-stats"></div>
      <p class="mt-out sc-out"></p>
    </div>
  </div>
</section>

<!-- 2: slide 84 -->
<section class="slide" data-title="Skill curves are diverse" data-demo="diverse">
  <div class="kicker">5 types of player skill curves · slide 84</div>
  <h2 class="sm">Diverse curves, <span class="accent">one game</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <h4>Game</h4>
      <div class="seg dv-game">
        <button class="btn on" data-k="lol">League of Legends</button>
        <button class="btn" data-k="wow">World of Warcraft</button>
      </div>
      <label class="rng">Hours played <b class="dv-hv"></b><input type="range" class="dv-h" min="0" max="400" step="1" value="100"></label>
      <div class="row wrap"><button class="btn dv-tour on">▶ Walk-through</button></div>
      <div class="mt-stats dv-stats"></div>
      <p class="mt-out dv-out"></p>
    </div>
  </div>
</section>

</div></div>
