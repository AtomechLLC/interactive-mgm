<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gold Item Trap · Directing Game Mechanics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/deck.css">
<link rel="stylesheet" href="../../../assets/kit.css">
<link rel="stylesheet" href="../../shared/dgms.css">
<script>
  window.DECK = { title: 'Directing Game Mechanics · Module 2 · The Gold Item Trap', home: '../index.html', audio: false, cues: null };
</script>
<script src="notes.js"></script>
<style>.mt-stats b { flex: none; }</style>
</head>
<body>
<div class="viewport"><div class="stage">

<!-- 1: slide 260 -->
<section class="slide" data-title="The gold item trap" data-demo="gold">
  <div class="kicker">psychology traps · slide 260</div>
  <h2 class="sm">The gold item <span class="accent">trap</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <label class="rng">Gold items stacked <b class="gi-nv"></b><input type="range" class="gi-n" min="1" max="6" step="1" value="3"></label>
      <label class="rng">Game length <b class="gi-lv"></b><input type="range" class="gi-l" min="15" max="60" step="1" value="35"></label>
      <label class="rng">Bought at minute <b class="gi-bv"></b><input type="range" class="gi-b" min="0" max="15" step="1" value="0"></label>
      <label class="chk"><input type="checkbox" class="gi-notes"> Show the notes' 180 gold/min</label>
      <div class="row wrap"><button class="btn gi-tour on">▶ Walk-through</button></div>
      <div class="mt-stats gi-stats"></div>
      <p class="mt-out gi-out"></p>
    </div>
  </div>
</section>

<!-- 2: slide 260, the designer's side -->
<section class="slide" data-title="Tune the gold item" data-demo="tune">
  <div class="kicker">psychology traps · slide 260</div>
  <h2 class="sm">When does it <span class="accent">pay back?</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <h4>Presets</h4>
      <div class="seg tu-pre"><button class="btn on" data-r="5" data-c="750">Deck's item</button><button class="btn" data-r="10" data-c="750">Notes' rate</button><button class="btn" data-r="5" data-c="400">Cheaper</button></div>
      <label class="rng">Gold per 10 seconds <b class="tu-rv"></b><input type="range" class="tu-r" min="1" max="15" step="1" value="5"></label>
      <label class="rng">Item price <b class="tu-cv"></b><input type="range" class="tu-c" min="250" max="1500" step="25" value="750"></label>
      <label class="rng">Bought at minute <b class="tu-bv"></b><input type="range" class="tu-b" min="0" max="15" step="1" value="5"></label>
      <div class="row wrap"><button class="btn tu-tour on">▶ Walk-through</button></div>
      <div class="mt-stats tu-stats"></div>
      <p class="mt-out tu-out"></p>
    </div>
  </div>
</section>

</div></div>
<script src="../../../assets/deck.js"></script>
