<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silhouette Test · Directing Game Mechanics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/deck.css">
<link rel="stylesheet" href="../../../assets/kit.css">
<link rel="stylesheet" href="../../shared/dgms.css">
<style>
  .sil-opts .btn { min-width: 46%; }
  .sil-opts .btn.hit { background: #2fae63; color: #fff; }
  .sil-opts .btn.miss { background: #e5322d; color: #fff; }
  .mt-stats div.cp { border-left-color: #2fae63; }
</style>
<script>
  window.DECK = { title: 'Directing Game Mechanics · Module 4 · Silhouette Test', home: '../../index.html', audio: false, cues: null };
</script>
<script src="notes.js"></script>
</head>
<body>
<div class="viewport"><div class="stage">

<section class="slide" data-title="Guess the shape" data-demo="guess">
  <div class="kicker">3Cs: character · Part 6, Character Shape &amp; Silhouette</div>
  <h2 class="sm">Who is this, in <span class="accent">solid black?</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <h4>Cast</h4>
      <div class="seg sil-set"><button class="btn on" data-s="mario">Super Mario</button><button class="btn" data-s="lol">League champions</button></div>
      <h4>Your guess</h4>
      <div class="seg sil-opts"></div>
      <div class="row wrap"><button class="btn sil-tour on">▶ Walk-through</button><button class="btn sil-next">Next shape</button><button class="btn sil-reset">Reset</button></div>
      <div class="mt-stats sil-stats"></div>
      <p class="mt-out sil-out"></p>
    </div>
  </div>
</section>

<section class="slide" data-title="Friend or foe" data-demo="sort">
  <div class="kicker">3Cs: character · Part 6, player, companions and opposition</div>
  <h2 class="sm">Friend or foe, by <span class="accent">shape alone</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <h4>Sort the shape in the middle</h4>
      <div class="seg sort-btns"><button class="btn sort-f" data-b="friend">◀ Friend</button><button class="btn sort-e" data-b="foe">Foe ▶</button></div>
      <p class="tip">Or click the left or right half of the picture.</p>
      <div class="row wrap"><button class="btn sort-tour on">▶ Walk-through</button><button class="btn sort-rev">Reveal</button><button class="btn sort-reset">Reset</button></div>
      <div class="mt-stats sort-stats"></div>
      <p class="mt-out sort-out"></p>
    </div>
  </div>
</section>

</div></div>
<script src="../../../assets/deck.js"></script>
<script src="../../../assets/kit.js"></script>
<script src="../../shared/topdown.js"></script>
<script src="silhouette-test.js"></script>
</body>
</html>
