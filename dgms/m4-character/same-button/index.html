<div class="viewport"><div class="stage">

<!-- 1: slides 9-20 -->
<section class="slide" data-title="Same button, five meanings" data-demo="button">
  <div class="kicker">3Cs: character · slides 9-20</div>
  <h2 class="sm">Same button, <span class="accent">five meanings</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <h4>Character state</h4>
      <div class="seg sb-state">
        <button class="btn on" data-s="idle">Idle</button><button class="btn" data-s="run">Running</button><button class="btn" data-s="swim">Swimming near a ledge</button>
        <button class="btn" data-s="tank">Tank</button><button class="btn" data-s="boost">Tank with rocket booster</button>
      </div>
      <h4>Input</h4>
      <div class="row wrap"><button class="btn sb-jump">Jump</button><span class="tip" style="margin:0">or press J or ↑</span></div>
      <div class="row wrap" style="margin-top:10px"><button class="btn sb-tour on">▶ Walk-through</button></div>
      <div class="mt-stats sb-stats"></div>
      <p class="mt-out sb-out"></p>
    </div>
  </div>
</section>

<!-- 2: slides 30-31 -->
<section class="slide" data-title="The 3Cs loop" data-demo="loop">
  <div class="kicker">3Cs: character · slides 30-31</div>
  <h2 class="sm">One press, <span class="accent">all the way around</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <h4>The loop</h4>
      <div class="row wrap"><button class="btn lp-send">Send a jump around</button><button class="btn lp-tour on">▶ Walk-through</button></div>
      <p class="tip" style="margin-top:10px">Click any box to read what it does.</p>
      <div class="mt-stats lp-stats"></div>
      <p class="mt-out lp-out"></p>
    </div>
  </div>
</section>
