<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music That Reacts · Directing Game Mechanics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/deck.css">
<link rel="stylesheet" href="../../../assets/kit.css">
<link rel="stylesheet" href="../../shared/dgms.css">
<link rel="stylesheet" href="reactive-music.css">
<script>
  window.DECK = { title: 'Directing Game Mechanics · Module 7 · Music That Reacts', home: '../../index.html', audio: false, cues: null };
</script>
<script src="notes.js"></script>
</head>
<body>
<div class="viewport"><div class="stage">

<section class="slide" data-title="Style layers" data-demo="rm-style">
  <div class="kicker">Music that reacts · style layers · slides 30-32</div>
  <h2 class="sm">The music rises with your <span class="accent">style</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <h4>Fight</h4>
      <div class="row wrap"><button class="btn rm-hit">⚔ Stylish hit</button><button class="btn rm-clear">Room clear</button></div>
      <p class="tip">Or click the arena. Stop hitting and the meter falls; each rank brings a stem in or takes one out, on the beat.</p>
      <div class="row wrap"><button class="btn rm-tour on">▶ Walk-through</button><button class="btn rm-snd">♪ Sound off</button></div>
      <div class="mt-stats rm-stats"></div>
      <p class="mt-out rm-out"></p>
    </div>
  </div>
</section>

<section class="slide" data-title="State changes" data-demo="rm-stealth">
  <div class="kicker">Music that reacts · state changes · slides 166-170</div>
  <h2 class="sm">Music notifies a <span class="accent">change of state</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <h4>Game</h4>
      <div class="seg rm-mode"><button class="btn on" data-m="mgs">Metal Gear Solid</button><button class="btn" data-m="botw">Breath of the Wild</button></div>
      <div class="row wrap rm-acts" data-m="mgs"><button class="btn" data-a="noise">Make a noise</button><button class="btn" data-a="spotted">Get spotted</button><button class="btn" data-a="hide">Hide</button></div>
      <div class="row wrap rm-acts" data-m="botw" hidden><button class="btn" data-a="spot">Guardian spots you</button><button class="btn" data-a="escape">Hide behind a rock</button></div>
      <div class="row wrap"><button class="btn rm-tour on">▶ Walk-through</button><button class="btn rm-snd">♪ Sound off</button></div>
      <div class="mt-stats rm-stats"></div>
      <p class="mt-out rm-out"></p>
    </div>
  </div>
</section>

</div></div>
<script src="../../../assets/deck.js"></script>
<script src="../../../assets/kit.js"></script>
<script src="../../shared/topdown.js"></script>
<script src="reactive-music.js"></script>
</body>
</html>
