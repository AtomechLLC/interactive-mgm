<!-- 1 -->
<section class="slide center" data-title="Contrapositive" data-demo="title">
  <div class="kicker rise">mechanics design tool 5</div>
  <h1 class="rise">Where can you <span class="accent">stand and still hit?</span></h1>
  <div class="rule rise" style="margin:22px auto"></div>
  <canvas class="demo ti-canvas rise" width="1040" height="520"></canvas>
  <p class="lede rise" style="margin:18px auto 0;text-align:center">Flip a rule around and a hidden imbalance shows up: melee vs ranged against the same monster.</p>

<!-- 2: slides 132-134 -->
<section class="slide" data-title="Melee vs Ranged" data-demo="arena">
  <div class="kicker">contrapositive thinking</div>
  <h2 class="sm">Ranged Can Hit Everyone, <span class="accent">Melee Only Who’s Close</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <h4>Tune the fight</h4>
      <label class="rng">Ranged reach <b class="ct-v-rr"></b><input type="range" class="ct-rr" min="2" max="10" step="0.1" value="9"></label>
      <label class="rng">Melee reach <b class="ct-v-mr"></b><input type="range" class="ct-mr" min="1.2" max="6" step="0.1" value="2.2"></label>
      <label class="rng">Shot lanes <b class="ct-v-ln"></b><input type="range" class="ct-ln" min="0" max="8" step="1" value="4"></label>
      <div class="row wrap"><button class="btn ct-tour on">▶ Walk-through</button><button class="btn ct-reset">Reset</button></div>
      <div class="mt-stats ct-stats"></div>
      <p class="mt-out ct-out"></p>
    </div>
  </div>
</section>
