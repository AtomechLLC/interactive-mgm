<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combat · Level Design Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/deck.css">
<link rel="stylesheet" href="../../assets/kit.css">
<link rel="stylesheet" href="../shared/blog.css">
<script>
  window.DECK = { title: 'Mastering Game Mechanics · Level Design Book · Combat', home: '../index.html', audio: false, cues: null };
</script>
<script src="notes.js"></script>
</head>
<body>
<div class="viewport"><div class="stage">

<section class="slide" data-title="Is this map fair?" data-demo="balance">
  <div class="kicker">combat · map balance</div>
  <h2 class="sm">Is this map <span class="accent">fair?</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <h4>Symmetry</h4>
      <div class="seg bl-sym"><button class="btn on" data-v="mirror">Mirrored</button><button class="btn" data-v="rot">Rotated</button><button class="btn" data-v="none">None: only blue has a perch</button></div>
      <label class="rng">Red’s walk to the middle <b class="bl-dv"></b><input type="range" class="bl-d" min="-3" max="3" step="0.5" value="0"></label>
      <h4>Chokepoints</h4>
      <div class="seg bl-choke"><button class="btn on" data-v="lane">One per lane</button><button class="btn" data-v="one">One for the whole map</button></div>
      <div class="mt-stats bl-stats"></div>
      <p class="mt-out bl-out"></p>
      <p class="src">Win rate, symmetry and chokepoints from <a href="https://book.leveldesignbook.com/process/combat/balance" target="_blank" rel="noopener">The Level Design Book: Balance</a> (CC BY-NC-SA 4.0). The book gives no formula: the map, the fight model and every number are our own.</p>
    </div>
  </div>
</section>

</div></div>
<script src="../../assets/deck.js"></script>
<script src="../../assets/kit.js"></script>
<script src="../shared/topdown.js"></script>
<script src="../shared/plan.js"></script>

</body>
</html>
