<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="viewport"><div class="stage">

<section class="slide" data-title="Dress the wall" data-demo="art">
  <div class="kicker">environment art · readability</div>
  <h2 class="sm">Dress <span class="accent">the wall</span></h2>
  <div class="mt-wrap">
    <canvas class="demo" width="1040" height="585"></canvas>
    <div class="mt-side">
      <h4>The art pass</h4>
      <label class="rng">Amount of detail <b class="ar-nv"></b><input type="range" class="ar-n" min="0" max="1" step="0.05" value="0.7"></label>
      <div class="seg ar-group"><button class="btn on" data-v="scatter">Spread evenly</button><button class="btn" data-v="cluster">In clusters</button></div>
      <label class="rng">Value contrast between surfaces <b class="ar-cv"></b><input type="range" class="ar-c" min="0" max="1" step="0.05" value="0.7"></label>
      <label class="chk"><input type="checkbox" class="ar-res"> Keep red and orange for what matters</label>
      <label class="chk"><input type="checkbox" class="ar-sq"> Squint at it</label>
      <div class="mt-stats ar-stats"></div>
      <p class="mt-out ar-out"></p>
      <p class="src">Readability, clustering and reserved colours from <a href="https://book.leveldesignbook.com/process/env-art" target="_blank" rel="noopener">The Level Design Book: Environment art</a> (CC BY-NC-SA 4.0). The street, the measurement and the squint check are our own.</p>
    </div>
  </div>
</section>

</div></div>
